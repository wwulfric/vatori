<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaadin Flow over IPC</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: #ffffff;
      color: #111827;
    }
    html,
    body {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #111827;
    }
    #app,
    #flow-client-engine-root {
      box-sizing: border-box;
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: #ffffff;
      color: #111827;
    }
    #app {
      padding: 28px;
    }
    #app[hidden],
    #flow-client-engine-root[hidden] {
      display: none !important;
    }
    #flow-client-engine-root {
      display: block;
      padding: 0;
      overflow: hidden;
    }
    .vatori-flow-client-container {
      display: block;
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      padding: 0;
      min-height: 0;
      max-width: 100%;
      overflow: auto;
      background: #ffffff;
      color: #111827;
    }
    #app *,
    #flow-client-engine-root *,
    .vatori-flow-client-container * {
      color: inherit;
    }
    #app vaadin-vertical-layout,
    #flow-client-engine-root vaadin-vertical-layout {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      max-width: 100%;
    }
    .vatori-flow-viewport-root {
      position: fixed;
      inset: 28px;
      box-sizing: border-box;
      z-index: 10;
      display: flex !important;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-height: 0;
      max-width: 100%;
      overflow: auto;
      background: #ffffff;
      color: #111827;
    }
    .vatori-flow-viewport-root > vaadin-vertical-layout,
    .vatori-flow-viewport-root vaadin-vertical-layout {
      display: flex !important;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      max-width: 100%;
    }
    #app vaadin-button,
    #flow-client-engine-root vaadin-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 32px;
      padding: 4px 14px;
      border: 1px solid #c7ccd3;
      border-radius: 6px;
      background: #f3f4f6;
      color: #111827;
    }
    #app input,
    #flow-client-engine-root input,
    #app vaadin-big-decimal-field,
    #flow-client-engine-root vaadin-big-decimal-field,
    #app vaadin-text-field,
    #flow-client-engine-root vaadin-text-field,
    #app vaadin-checkbox,
    #flow-client-engine-root vaadin-checkbox {
      display: inline-block;
      max-width: 100%;
    }
    .flow-layout {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }
    button {
      appearance: auto;
      font: inherit;
      min-height: 32px;
      padding: 4px 14px;
    }
    input {
      font: inherit;
      min-height: 28px;
      color: #111827;
      background: #ffffff;
    }
    input[type="text"] {
      min-width: 240px;
      padding: 3px 8px;
    }
    .flow-list {
      display: grid;
      grid-template-columns: 120px 160px 1fr;
      gap: 1px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
      min-width: min(640px, 100%);
      background: #d1d5db;
    }
    .flow-list span {
      padding: 8px 10px;
      background: #ffffff;
    }
    #trace {
      position: fixed;
      left: -10000px;
      bottom: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <section id="flow-client-engine-root" hidden></section>
  <div id="trace"></div>
  <script>
__VATORI_FLOW_IPC_SHELL_SCRIPT__
  </script>
</body>
</html>
